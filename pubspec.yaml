name: chat_media_picker
description: >-
  Chat attachment picker: draggable sheet with gallery,
  camera and file picker, plus an editor with crop, draw, text and captions.
version: 0.2.2
repository: https://github.com/ravikant-rentfoxxy/custom_media_picker
issue_tracker: https://github.com/ravikant-rentfoxxy/custom_media_picker/issues

screenshots:
  - description: Attachment panel with Gallery, Camera and Document options over recent photos.
    path: screenshots/1_attach_panel.jpg
  - description: Expanded gallery with numbered multi-select.
    path: screenshots/2_gallery_multi_select.jpg
  - description: Editor with a caption per item and a thumbnail strip.
    path: screenshots/3_editor.jpg
  - description: Drawing on a photo in the editor.
    path: screenshots/4_editor_draw.jpg
  - description: Attachment panel with the dark theme.
    path: screenshots/5_dark_attach_panel.jpg
  - description: Gallery with the dark theme.
    path: screenshots/6_dark_gallery.jpg
  - description: Compact options panel with the gallery disabled.
    path: screenshots/7_options_only.jpg

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.3
  photo_manager: ^3.12.0
  camera: ^0.12.0+2
  path_provider: ^2.1.6
  video_player: ^2.11.1
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
