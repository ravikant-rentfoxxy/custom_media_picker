name: chat_media_picker
description: >-
  WhatsApp-style attachment picker for Flutter (GetX): gallery bottom sheet
  with photos and videos, custom camera, and an editor with crop, rotate,
  draw, text and captions.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.3
  photo_manager: ^3.12.0
  camera: ^0.12.0+2
  path_provider: ^2.1.6
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
